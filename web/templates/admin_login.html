<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ — 19 VPN</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>">
</head>
<body>
    <div class="admin-login-page">
        <div class="admin-login-card">
            <div class="text-center mb-2">
                <span class="logo-icon" style="display:inline-flex;width:48px;height:48px;font-size:24px;margin-bottom:12px">19</span>
            </div>
            <h2>19 VPN Админ</h2>
            <p class="subtitle">Войдите для управления VPN-сервисом</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for cat, msg in messages %}
                <p style="color: var(--red); text-align: center; margin-bottom: 16px; font-size:14px">{{ msg }}</p>
                {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" required placeholder="admin" autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Sign In</button>
            </form>

            <p class="text-center mt-2">
                <a href="/" style="font-size:13px;color:var(--text-muted)">&#8592; Назад на 19 VPN</a>
            </p>
        </div>
    </div>
</body>
</html>
